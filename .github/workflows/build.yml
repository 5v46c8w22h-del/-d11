name: Build D11 BLE Analyzer IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project D11BLEAnalyzer.xcodeproj \
            -scheme D11BLEAnalyzer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/D11BLEAnalyzer.app Payload/
          zip -r D11BLEAnalyzer-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: D11BLEAnalyzer-unsigned
          path: D11BLEAnalyzer-unsigned.ipa
